<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Introvert Test</title>
  <style>
    :root {
      --bg-top: #0d142e;
      --bg-mid: #16204a;
      --bg-bottom: #232f5e;
      --hero-gradient: linear-gradient(-21.06deg, rgb(24, 13, 169) 17.83%, rgb(91, 82, 255) 75.64%);
      --screen-bg: #f5f6f6;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100svh; }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vmin 4vw;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ---- night sky ---- */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .stars, .stars-2 {
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #fff;
    }
    .stars {
      box-shadow:
        8vw 12vh 0 0 #fff, 22vw 6vh 0 0 rgba(255,255,255,.7), 34vw 18vh 0 0 #fff,
        47vw 8vh 0 0 rgba(255,255,255,.6), 61vw 14vh 0 0 #fff, 74vw 5vh 0 0 rgba(255,255,255,.8),
        88vw 16vh 0 0 rgba(255,255,255,.65), 15vw 82vh 0 0 rgba(255,255,255,.5),
        52vw 90vh 0 0 rgba(255,255,255,.6), 83vw 86vh 0 0 rgba(255,255,255,.55),
        5vw 45vh 0 0 rgba(255,255,255,.4), 94vw 55vh 0 0 rgba(255,255,255,.45);
      animation: twinkle 3.2s ease-in-out infinite alternate;
    }
    .stars-2 {
      width: 1.5px; height: 1.5px;
      box-shadow:
        13vw 25vh 0 0 rgba(255,255,255,.6), 28vw 10vh 0 0 rgba(255,255,255,.5),
        42vw 22vh 0 0 rgba(255,255,255,.55), 57vw 4vh 0 0 rgba(255,255,255,.5),
        68vw 20vh 0 0 rgba(255,255,255,.6), 81vw 9vh 0 0 rgba(255,255,255,.45),
        93vw 28vh 0 0 rgba(255,255,255,.5), 8vw 65vh 0 0 rgba(255,255,255,.4),
        37vw 88vh 0 0 rgba(255,255,255,.45), 70vw 92vh 0 0 rgba(255,255,255,.4);
      animation: twinkle 2.4s ease-in-out .8s infinite alternate;
    }

    /* ---- layout ---- */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 6vh, 64px);
      align-items: center;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(24px, 6vw, 72px);
      justify-content: center;
      align-items: center;
    }

    /* ---- iPhone mockup ---- */
    .phone {
      width: min(340px, 86vw);
      container-type: inline-size;
    }
    .frame {
      padding: 2.6cqw;
      border-radius: 16.4cqw;
      background: #0c0c10;
      box-shadow:
        inset 0 0 0 0.45cqw rgba(255, 255, 255, .12),
        0 30px 70px rgba(0, 0, 0, .55);
    }
    .screen {
      position: relative;
      aspect-ratio: 440 / 956;
      background: var(--screen-bg);
      border-radius: 13.8cqw;
      overflow: hidden;
    }

    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 45.29%;
      background: var(--hero-gradient);
    }

    .cat, .fire {
      position: absolute;
      display: block;
    }

    /* medium scene placement, with a gap between cat and fire */
    .screen.happy .cat  { left: 7%; top: 8.3%; width: 53.6%; }
    .screen.happy .fire { left: 54%; top: 17.2%; width: 35.7%; }
    .screen.sad .cat    { left: 3.5%; top: 8.4%; width: 57%; }
    .screen.sad .fire   { left: 55.5%; top: 14.9%; width: 35.3%; }

    .card {
      position: absolute;
      left: 3.64%;
      top: 38.08%;
      width: 92.73%;
      height: 19.14%;
      background: #fff;
      border-radius: 5.2cqw;
      box-shadow: 0 1px 4px rgba(12, 12, 13, .05);
    }

    /* ---- Dynamic Island + status bar ---- */
    .island {
      position: absolute;
      top: 2.6cqw;
      left: 50%;
      transform: translateX(-50%);
      width: 27cqw;
      height: 8cqw;
      background: #000;
      border-radius: 4.5cqw;
      z-index: 5;
    }
    .island::after {
      content: "";
      position: absolute;
      right: 1.9cqw;
      top: 50%;
      transform: translateY(-50%);
      width: 4.6cqw;
      height: 4.6cqw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1c2333, #06070d 62%);
    }
    .status {
      position: absolute;
      top: 3.1cqw;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8cqw 0 11cqw;
      height: 7cqw;
      color: #fff;
      font-size: 4.1cqw;
      font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }
    .status svg { width: 15cqw; height: auto; display: block; }

    @keyframes twinkle {
      from { opacity: .3; }
      to   { opacity: .95; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars-2"></div>
  </div>

  <!-- shared status-bar glyphs: cellular, wifi, battery -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="status-icons" viewBox="0 0 64 14">
      <rect x="0"    y="8.5" width="3.2" height="4"    rx="1" fill="#fff"/>
      <rect x="4.8"  y="6.5" width="3.2" height="6"    rx="1" fill="#fff"/>
      <rect x="9.6"  y="4"   width="3.2" height="8.5"  rx="1" fill="#fff"/>
      <rect x="14.4" y="1.5" width="3.2" height="11"   rx="1" fill="#fff"/>
      <path d="M21.8 7.3a8 8 0 0 1 12 0" stroke="#fff" stroke-width="2.1" stroke-linecap="round" fill="none"/>
      <path d="M24.7 10.1a4.4 4.4 0 0 1 6.2 0" stroke="#fff" stroke-width="2.1" stroke-linecap="round" fill="none"/>
      <circle cx="27.8" cy="12.4" r="1.6" fill="#fff"/>
      <rect x="38.8" y="1.75" width="21.5" height="10.5" rx="3.2" stroke="#fff" stroke-opacity=".4" stroke-width="1.2" fill="none"/>
      <rect x="40.7" y="3.6" width="17.7" height="6.8" rx="1.8" fill="#fff"/>
      <path d="M61.6 5.2v3.6a1.9 1.9 0 0 0 0-3.6Z" fill="#fff" fill-opacity=".4"/>
    </symbol>
  </svg>

  <main class="stage">
    <div class="row">
      <!-- Happy: dancing cat, burning fire -->
      <div class="phone">
        <div class="frame">
          <div class="screen happy">
            <div class="hero"></div>
            <img class="cat"  src="assets/cat-happy.svg"  alt="Котик танцует у горящего костра">
            <img class="fire" src="assets/fire-happy.svg" alt="">
            <div class="card"></div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 64 14"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
          </div>
        </div>
      </div>

      <!-- Sad: shivering cat, extinguished fire -->
      <div class="phone">
        <div class="frame">
          <div class="screen sad">
            <div class="hero"></div>
            <img class="cat"  src="assets/cat-sad.svg"  alt="Котик замёрз у потухшего костра">
            <img class="fire" src="assets/fire-sad.svg" alt="">
            <div class="card"></div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 64 14"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
