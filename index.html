<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Introvert Test</title>
  <style>
    :root {
      --bg-top: #0d142e;
      --bg-mid: #16204a;
      --bg-bottom: #232f5e;
      --hero-gradient: linear-gradient(-21.06deg, #223468 17.83%, #4A70C4 75.64%);
      --screen-bg: #f5f6f6;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100svh; }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vmin 4vw;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ---- night sky ---- */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .stars, .stars-2 {
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #fff;
    }
    .stars {
      box-shadow:
        8vw 12vh 0 0 #fff, 22vw 6vh 0 0 rgba(255,255,255,.7), 34vw 18vh 0 0 #fff,
        47vw 8vh 0 0 rgba(255,255,255,.6), 61vw 14vh 0 0 #fff, 74vw 5vh 0 0 rgba(255,255,255,.8),
        88vw 16vh 0 0 rgba(255,255,255,.65), 15vw 82vh 0 0 rgba(255,255,255,.5),
        52vw 90vh 0 0 rgba(255,255,255,.6), 83vw 86vh 0 0 rgba(255,255,255,.55),
        5vw 45vh 0 0 rgba(255,255,255,.4), 94vw 55vh 0 0 rgba(255,255,255,.45);
      animation: twinkle 3.2s ease-in-out infinite alternate;
    }
    .stars-2 {
      width: 1.5px; height: 1.5px;
      box-shadow:
        13vw 25vh 0 0 rgba(255,255,255,.6), 28vw 10vh 0 0 rgba(255,255,255,.5),
        42vw 22vh 0 0 rgba(255,255,255,.55), 57vw 4vh 0 0 rgba(255,255,255,.5),
        68vw 20vh 0 0 rgba(255,255,255,.6), 81vw 9vh 0 0 rgba(255,255,255,.45),
        93vw 28vh 0 0 rgba(255,255,255,.5), 8vw 65vh 0 0 rgba(255,255,255,.4),
        37vw 88vh 0 0 rgba(255,255,255,.45), 70vw 92vh 0 0 rgba(255,255,255,.4);
      animation: twinkle 2.4s ease-in-out .8s infinite alternate;
    }

    /* ---- layout ---- */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 6vh, 64px);
      align-items: center;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(24px, 6vw, 72px);
      justify-content: center;
      align-items: center;
    }

    /* ---- iPhone mockup ---- */
    .phone {
      width: min(340px, 86vw);
      container-type: inline-size;
    }
    .frame {
      padding: 2.6cqw;
      border-radius: 16.4cqw;
      background: #0c0c10;
      box-shadow:
        inset 0 0 0 0.45cqw rgba(255, 255, 255, .12),
        0 30px 70px rgba(0, 0, 0, .55);
    }
    .screen {
      position: relative;
      aspect-ratio: 440 / 956;
      background: var(--screen-bg);
      border-radius: 13.8cqw;
      overflow: hidden;
    }

    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 45.29%;
      background: var(--hero-gradient);
    }

    .cat, .fire {
      position: absolute;
      display: block;
    }

    /* medium scene placement, with a gap between cat and fire */
    .screen.happy .cat  { left: 7%; top: 8.3%; width: 53.6%; }
    .screen.happy .fire { left: 54%; top: 17.2%; width: 35.7%; }
    .screen.sad .cat    { left: 3.5%; top: 8.4%; width: 57%; }
    .screen.sad .fire   { left: 55.5%; top: 14.9%; width: 35.3%; }

    .card {
      position: absolute;
      left: 3.64%;
      top: 38.08%;
      width: 92.73%;
      height: 19.14%;
      background: #fff;
      border-radius: 5.2cqw;
      box-shadow: 0 1px 4px rgba(12, 12, 13, .05);
    }

    /* ---- Dynamic Island + status bar ---- */
    .island {
      position: absolute;
      top: 2.6cqw;
      left: 50%;
      transform: translateX(-50%);
      width: 27cqw;
      height: 8cqw;
      background: #000;
      border-radius: 4.5cqw;
      z-index: 5;
    }
    .island::after {
      content: "";
      position: absolute;
      right: 1.9cqw;
      top: 50%;
      transform: translateY(-50%);
      width: 4.6cqw;
      height: 4.6cqw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1c2333, #06070d 62%);
    }
    .status {
      position: absolute;
      top: 3.1cqw;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.2cqw 0 14.2cqw;
      height: 7cqw;
      color: #fff;
      font-size: 3.7cqw;
      font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }
    .status svg { width: 16.7cqw; height: auto; display: block; }

    @keyframes twinkle {
      from { opacity: .3; }
      to   { opacity: .95; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars-2"></div>
  </div>

  <!-- shared status-bar glyphs: cellular, wifi, battery -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="status-icons" viewBox="0 0 77.7 13">
      <!-- Cellular Connection (из Figma) -->
      <g transform="translate(0, 0.39)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.2 1.14623C19.2 0.513183 18.7224 0 18.1333 0H17.0667C16.4776 0 16 0.513183 16 1.14623V11.0802C16 11.7132 16.4776 12.2264 17.0667 12.2264H18.1333C18.7224 12.2264 19.2 11.7132 19.2 11.0802V1.14623ZM11.7659 2.44528H12.8326C13.4217 2.44528 13.8992 2.97078 13.8992 3.61902V11.0527C13.8992 11.7009 13.4217 12.2264 12.8326 12.2264H11.7659C11.1768 12.2264 10.6992 11.7009 10.6992 11.0527V3.61902C10.6992 2.97078 11.1768 2.44528 11.7659 2.44528ZM7.43411 5.09433H6.36745C5.77834 5.09433 5.30078 5.62652 5.30078 6.28301V11.0377C5.30078 11.6942 5.77834 12.2264 6.36745 12.2264H7.43411C8.02322 12.2264 8.50078 11.6942 8.50078 11.0377V6.28301C8.50078 5.62652 8.02322 5.09433 7.43411 5.09433ZM2.13333 7.53962H1.06667C0.477563 7.53962 0 8.06421 0 8.71132V11.0547C0 11.7018 0.477563 12.2264 1.06667 12.2264H2.13333C2.72244 12.2264 3.2 11.7018 3.2 11.0547V8.71132C3.2 8.06421 2.72244 7.53962 2.13333 7.53962Z" fill="#fff"/>
      </g>
      <!-- Wifi (из Figma) -->
      <g transform="translate(26.2, 0.34)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M8.5713 2.46628C11.0584 2.46639 13.4504 3.38847 15.2529 5.04195C15.3887 5.1696 15.6056 5.16799 15.7393 5.03834L17.0368 3.77487C17.1045 3.70911 17.1422 3.62004 17.1417 3.52735C17.1411 3.43467 17.1023 3.34603 17.0338 3.28104C12.3028 -1.09368 4.83907 -1.09368 0.108056 3.28104C0.039524 3.34598 0.000639766 3.4346 7.82398e-06 3.52728C-0.000624118 3.61996 0.0370483 3.70906 0.104689 3.77487L1.40255 5.03834C1.53615 5.16819 1.75327 5.1698 1.88893 5.04195C3.69167 3.38836 6.08395 2.46628 8.5713 2.46628ZM8.56795 6.68656C9.92527 6.68647 11.2341 7.19821 12.2403 8.12234C12.3763 8.2535 12.5907 8.25065 12.7234 8.11593L14.0106 6.79663C14.0784 6.72742 14.1161 6.63355 14.1151 6.53599C14.1141 6.43844 14.0746 6.34536 14.0054 6.27757C10.9416 3.38672 6.19688 3.38672 3.13305 6.27757C3.06384 6.34536 3.02435 6.43849 3.02345 6.53607C3.02254 6.63365 3.06028 6.72752 3.12822 6.79663L4.41513 8.11593C4.54778 8.25065 4.76215 8.2535 4.89823 8.12234C5.90368 7.19882 7.21152 6.68713 8.56795 6.68656ZM11.0924 9.48011C11.0943 9.58546 11.0572 9.68703 10.9899 9.76084L8.81327 12.2156C8.74946 12.2877 8.66247 12.3283 8.5717 12.3283C8.48093 12.3283 8.39394 12.2877 8.33013 12.2156L6.1531 9.76084C6.08585 9.68697 6.04886 9.58537 6.05085 9.48002C6.05284 9.37467 6.09365 9.27491 6.16364 9.20429C7.55374 7.8904 9.58966 7.8904 10.9798 9.20429C11.0497 9.27497 11.0904 9.37476 11.0924 9.48011Z" fill="#fff"/>
      </g>
      <!-- Battery (из Figma) -->
      <g transform="translate(50.34, 0)">
        <rect opacity="0.35" x="0.5" y="0.5" width="24" height="12" rx="3.8" stroke="#fff" fill="none"/>
        <path opacity="0.4" d="M26 4.5V8.57547C26.8047 8.2303 27.328 7.42734 27.328 6.53774C27.328 5.64813 26.8047 4.84517 26 4.5" fill="#fff"/>
        <rect x="2" y="2" width="21" height="9" rx="2.5" fill="#fff"/>
      </g>
    </symbol>
  </svg>

  <main class="stage">
    <div class="row">
      <!-- Happy: dancing cat, burning fire -->
      <div class="phone">
        <div class="frame">
          <div class="screen happy">
            <div class="hero"></div>
            <img class="cat"  src="assets/cat-happy.svg"  alt="Котик танцует у горящего костра">
            <img class="fire" src="assets/fire-happy.svg" alt="">
            <div class="card"></div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 77.7 13"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
          </div>
        </div>
      </div>

      <!-- Sad: shivering cat, extinguished fire -->
      <div class="phone">
        <div class="frame">
          <div class="screen sad">
            <div class="hero"></div>
            <img class="cat"  src="assets/cat-sad.svg"  alt="Котик замёрз у потухшего костра">
            <img class="fire" src="assets/fire-sad.svg" alt="">
            <div class="card"></div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 77.7 13"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
