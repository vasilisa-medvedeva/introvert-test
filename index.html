<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Introvert Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --case-sky-top: #F3FAFF;
      --case-sky-bottom: #E7F3FC;
      --hero-green: linear-gradient(152.54deg, #88BD00 24.52%, #597B00 76.38%);
      --screen-bg: #f5f6f6;
      --ink: #282828;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100svh; }

    body {
      background: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ---- layout: two cases on sky backers ---- */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 100px;
      align-items: center;
      padding: 40px 3vw;
    }
    .case {
      /* размеры как у project-card__stage в портфолио: ~790×510, radius 24 */
      background: linear-gradient(180deg, var(--case-sky-top), var(--case-sky-bottom));
      width: min(980px, 94vw);
      height: 640px;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ---- iPhone mockup ---- */
    .phone {
      width: min(278px, 60vw);
      container-type: inline-size;
    }
    .frame {
      padding: 2.6cqw;
      border-radius: 16.4cqw;
      background: #0c0c10;
      box-shadow:
        inset 0 0 0 0.45cqw rgba(255, 255, 255, .12),
        0 30px 70px rgba(13, 40, 66, .45);
    }
    .screen {
      position: relative;
      aspect-ratio: 440 / 956;
      background: var(--screen-bg);
      border-radius: 13.8cqw;
      overflow: hidden;
      font-family: 'Onest', system-ui, sans-serif;
    }

    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 71.55%;
      border-radius: 0 0 8.62cqw 8.62cqw;
      background: var(--hero-green);
    }

    .cat, .fire {
      position: absolute;
      display: block;
    }

    /* scene placement (design 2049:2923) */
    .screen.happy .cat  { left: 7%; top: 19%; width: 53.6%; }
    .screen.happy .fire { left: 49.45%; top: 27.9%; width: 35.7%; }
    .screen.sad .cat    { left: 3.5%; top: 19.1%; width: 57%; }
    .screen.sad .fire   { left: 50.95%; top: 25.6%; width: 35.3%; }

    /* ---- result card ---- */
    .card {
      position: absolute;
      left: 3.64%;
      top: 51.67%;
      width: 92.73%;
      height: 18.2%;
      background: #fff;
      border-radius: 6.9cqw;
      box-shadow: 0 1px 2px rgba(12, 12, 13, .05);
      padding: 3.4cqw 3.4cqw 3cqw;
      color: var(--ink);
    }
    .card .date {
      font-size: 3.45cqw;
      font-weight: 600;
      letter-spacing: -.05em;
    }
    .card .title {
      margin: 1.1cqw 0 0;
      font-size: 4.74cqw;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: .005em;
    }
    .card .caption {
      margin: 1.1cqw 0 0;
      font-size: 3cqw;
      font-weight: 400;
      letter-spacing: -.057em;
    }

    /* ---- skill progress bar (Гармонизатор) ---- */
    .skill { position: relative; margin-top: 4.5cqw; }
    .skill-track {
      height: 3.88cqw;
      border-radius: 1.72cqw;
      background: #EEE;
    }
    .skill-fill {
      position: relative;
      height: 100%;
      width: 25.5%; /* стартовая ширина, вырастет до 30.85% (+7) */
      border-radius: inherit;
      background: #5A7C01;
      animation: skill-grow .5s cubic-bezier(.34, 1.56, .64, 1) 1.5s forwards;
    }
    .skill-num {
      position: absolute;
      right: 5cqw;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.59cqw;
      color: #fff;
      opacity: 0;
      animation: num-in .3s ease 1.7s forwards;
    }
    .skill-lotus {
      position: absolute;
      left: calc(100% - 3.77cqw); /* центр цветка на кончике заливки */
      top: -1.5cqw;
      width: 7.54cqw;
      animation: lotus-pop .45s ease 1.5s;
    }
    .plus-fly {
      position: absolute;
      left: 25cqw;
      top: -3.4cqw;
      font-size: 2.8cqw;
      font-weight: 700;
      color: #3D5400;
      opacity: 0;
      transform: translate(10cqw, -8cqw) rotate(-15deg) scale(.8);
      animation:
        plus-fly-in .7s cubic-bezier(.22, .9, .36, 1) .8s forwards,
        plus-fade .4s ease 1.9s forwards;
    }
    @keyframes skill-grow { to { width: 30.85%; } }
    @keyframes num-in { to { opacity: 1; } }
    @keyframes lotus-pop { 40% { transform: scale(1.25); } }
    @keyframes plus-fly-in {
      to { opacity: 1; transform: translate(0, 0) rotate(-15deg) scale(1); }
    }
    @keyframes plus-fade {
      to { opacity: 0; transform: translate(-1cqw, 1.5cqw) rotate(-15deg) scale(.6); }
    }

    /* ---- other discoveries ---- */
    .others {
      position: absolute;
      top: 74.06%;
      left: 3.45cqw;
      font-size: 3.45cqw;
      font-weight: 600;
      letter-spacing: -.05em;
      color: var(--ink);
    }
    .chips {
      position: absolute;
      top: 77.4%;
      left: 3.45cqw;
      display: flex;
      gap: 1.72cqw;
    }
    .chip {
      background: #fff;
      border-radius: 5.17cqw;
      padding: 3cqw 3.45cqw;
      display: flex;
      flex-direction: column;
      gap: 1.72cqw;
      box-shadow: 0 1px 2px rgba(12, 12, 13, .05);
      color: var(--ink);
    }
    .chip img { width: 5.17cqw; height: 5.17cqw; display: block; }
    .chip .row {
      display: flex;
      gap: .86cqw;
      font-size: 3.45cqw;
      letter-spacing: -.05em;
      white-space: nowrap;
    }

    /* ---- Dynamic Island + status bar + home ---- */
    .island {
      position: absolute;
      top: 2.6cqw;
      left: 50%;
      transform: translateX(-50%);
      width: 27cqw;
      height: 8cqw;
      background: #000;
      border-radius: 4.5cqw;
      z-index: 5;
    }
    .island::after {
      content: "";
      position: absolute;
      right: 1.9cqw;
      top: 50%;
      transform: translateY(-50%);
      width: 4.6cqw;
      height: 4.6cqw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1c2333, #06070d 62%);
    }
    .status {
      position: absolute;
      top: 3.1cqw;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.2cqw 0 14.2cqw;
      height: 7cqw;
      color: #fff;
      font-size: 3.7cqw;
      font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }
    .status svg { width: 16.7cqw; height: auto; display: block; }
    .home {
      position: absolute;
      bottom: 1.72cqw;
      left: 50%;
      transform: translateX(-50%);
      width: 31cqw;
      height: 1.08cqw;
      border-radius: 99cqw;
      background: #000;
      z-index: 6;
    }

    /* ---- story progress + close ---- */
    .progress {
      position: absolute;
      top: 16cqw; /* 74px макета: контейнер top 62 + py 12 */
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      gap: 1.7cqw;
      padding: 0 3.45cqw;
    }
    .progress span {
      flex: 1;
      height: .9cqw;
      border-radius: .45cqw;
      background: rgba(255, 255, 255, .4);
      position: relative;
    }
    .progress .active::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 51%;
      border-radius: inherit;
      background: #fff;
    }
    .close {
      position: absolute;
      top: 20.3cqw;
      right: 3.45cqw;
      width: 8.6cqw;
      height: 8.6cqw;
      z-index: 4;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .skill-fill { width: 30.85%; } /* сразу финальное состояние */
      .skill-num { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- shared status-bar glyphs: cellular, wifi, battery -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="status-icons" viewBox="0 0 77.7 13">
      <!-- Cellular Connection (из Figma) -->
      <g transform="translate(0, 0.39)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.2 1.14623C19.2 0.513183 18.7224 0 18.1333 0H17.0667C16.4776 0 16 0.513183 16 1.14623V11.0802C16 11.7132 16.4776 12.2264 17.0667 12.2264H18.1333C18.7224 12.2264 19.2 11.7132 19.2 11.0802V1.14623ZM11.7659 2.44528H12.8326C13.4217 2.44528 13.8992 2.97078 13.8992 3.61902V11.0527C13.8992 11.7009 13.4217 12.2264 12.8326 12.2264H11.7659C11.1768 12.2264 10.6992 11.7009 10.6992 11.0527V3.61902C10.6992 2.97078 11.1768 2.44528 11.7659 2.44528ZM7.43411 5.09433H6.36745C5.77834 5.09433 5.30078 5.62652 5.30078 6.28301V11.0377C5.30078 11.6942 5.77834 12.2264 6.36745 12.2264H7.43411C8.02322 12.2264 8.50078 11.6942 8.50078 11.0377V6.28301C8.50078 5.62652 8.02322 5.09433 7.43411 5.09433ZM2.13333 7.53962H1.06667C0.477563 7.53962 0 8.06421 0 8.71132V11.0547C0 11.7018 0.477563 12.2264 1.06667 12.2264H2.13333C2.72244 12.2264 3.2 11.7018 3.2 11.0547V8.71132C3.2 8.06421 2.72244 7.53962 2.13333 7.53962Z" fill="#fff"/>
      </g>

      <g transform="translate(26.2, 0.34)">

      </g>
      <!-- Battery (из Figma) -->
      <g transform="translate(50.34, 0)">
        <rect opacity="0.35" x="0.5" y="0.5" width="24" height="12" rx="3.8" stroke="#fff" fill="none"/>
        <path opacity="0.4" d="M26 4.5V8.57547C26.8047 8.2303 27.328 7.42734 27.328 6.53774C27.328 5.64813 26.8047 4.84517 26 4.5" fill="#fff"/>
        <rect x="2" y="2" width="21" height="9" rx="2.5" fill="#fff"/>
      </g>
    </symbol>
  </svg>

  <main class="stage">
    <!-- Case 1: happy result -->
    <section class="case">
      <div class="phone">
        <div class="frame">
          <div class="screen happy">
            <div class="hero"></div>
            <div class="progress" aria-hidden="true"><span class="active"></span><span></span><span></span></div>
            <img class="close" src="assets/icon-close.svg" alt="">
            <img class="cat"  src="assets/cat-happy.svg"  alt="Котик танцует у горящего костра">
            <img class="fire" src="assets/fire-happy.svg" alt="">
            <div class="card">
              <div class="date">14-20 июля</div>
              <p class="title">Благодаря тебе во мне <br>вырос Гармонизатор</p>
              <p class="caption">Ты чаще всего смотрел про осознанность</p>
              <div class="skill">
                <div class="skill-track">
                  <div class="skill-fill">
                    <span class="skill-num">+7</span>
                    <img class="skill-lotus" src="assets/icon-hormonizer.svg" alt="">
                  </div>
                </div>
                <span class="plus-fly">+7</span>
              </div>
            </div>
            <div class="others">Другие открытия недели</div>
            <div class="chips">
              <div class="chip">
                <img src="assets/icon-lifehacker.png" alt="">
                <div class="row"><span>+1</span><span>Лайфхакер</span></div>
              </div>
              <div class="chip">
                <img src="assets/icon-intuit.png" alt="">
                <div class="row"><span>+2</span><span>Интуит</span></div>
              </div>
            </div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 77.7 13"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
            <div class="home" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Case 2: sad result -->
    <section class="case">
      <div class="phone">
        <div class="frame">
          <div class="screen sad">
            <div class="hero"></div>
            <div class="progress" aria-hidden="true"><span class="active"></span></div>
            <img class="close" src="assets/icon-close.svg" alt="">
            <img class="cat"  src="assets/cat-sad.svg"  alt="Котик замёрз у потухшего костра">
            <img class="fire" src="assets/fire-sad.svg" alt="">
            <div class="card"></div>
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <svg viewBox="0 0 77.7 13"><use href="#status-icons"/></svg>
            </div>
            <div class="island"></div>
            <div class="home" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
