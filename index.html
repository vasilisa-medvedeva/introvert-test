<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Introvert Test</title>
  <style>
    :root {
      --bg-top: #0d142e;
      --bg-mid: #16204a;
      --bg-bottom: #232f5e;
      --hero-gradient: linear-gradient(-21.06deg, rgb(24, 13, 169) 17.83%, rgb(91, 82, 255) 75.64%);
      --screen-bg: #f5f6f6;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100svh; }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vmin 4vw;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ---- night sky ---- */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .stars, .stars-2 {
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #fff;
    }
    .stars {
      box-shadow:
        8vw 12vh 0 0 #fff, 22vw 6vh 0 0 rgba(255,255,255,.7), 34vw 18vh 0 0 #fff,
        47vw 8vh 0 0 rgba(255,255,255,.6), 61vw 14vh 0 0 #fff, 74vw 5vh 0 0 rgba(255,255,255,.8),
        88vw 16vh 0 0 rgba(255,255,255,.65), 15vw 82vh 0 0 rgba(255,255,255,.5),
        52vw 90vh 0 0 rgba(255,255,255,.6), 83vw 86vh 0 0 rgba(255,255,255,.55),
        5vw 45vh 0 0 rgba(255,255,255,.4), 94vw 55vh 0 0 rgba(255,255,255,.45);
      animation: twinkle 3.2s ease-in-out infinite alternate;
    }
    .stars-2 {
      width: 1.5px; height: 1.5px;
      box-shadow:
        13vw 25vh 0 0 rgba(255,255,255,.6), 28vw 10vh 0 0 rgba(255,255,255,.5),
        42vw 22vh 0 0 rgba(255,255,255,.55), 57vw 4vh 0 0 rgba(255,255,255,.5),
        68vw 20vh 0 0 rgba(255,255,255,.6), 81vw 9vh 0 0 rgba(255,255,255,.45),
        93vw 28vh 0 0 rgba(255,255,255,.5), 8vw 65vh 0 0 rgba(255,255,255,.4),
        37vw 88vh 0 0 rgba(255,255,255,.45), 70vw 92vh 0 0 rgba(255,255,255,.4);
      animation: twinkle 2.4s ease-in-out .8s infinite alternate;
    }

    /* ---- layout ---- */
    .stage {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: clamp(24px, 6vw, 72px);
      justify-content: center;
      align-items: center;
    }

    /* ---- iPhone mockup ---- */
    .phone {
      width: min(340px, 86vw);
      container-type: inline-size;
    }
    .frame {
      padding: 2.6cqw;
      border-radius: 16.4cqw;
      background: #0c0c10;
      box-shadow:
        inset 0 0 0 0.45cqw rgba(255, 255, 255, .12),
        0 30px 70px rgba(0, 0, 0, .55);
    }
    .screen {
      position: relative;
      aspect-ratio: 440 / 956;
      background: var(--screen-bg);
      border-radius: 13.8cqw;
      overflow: hidden;
    }

    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 45.29%;
      background: var(--hero-gradient);
    }

    .cat, .fire {
      position: absolute;
      display: block;
    }

    /* happy screen placement */
    .screen.happy .cat  { left: 1%;  top: 4.5%;  width: 63%; }
    .screen.happy .fire { left: 51%; top: 13.6%; width: 42%; }

    /* sad screen placement (same fire spot, cat slightly wider drawing) */
    .screen.sad .cat  { left: 0%;  top: 4.7%;  width: 67%; }
    .screen.sad .fire { left: 51.5%; top: 11.4%; width: 41.5%; }

    .card {
      position: absolute;
      left: 3.64%;
      top: 38.08%;
      width: 92.73%;
      height: 19.14%;
      background: #fff;
      border-radius: 5.2cqw;
      box-shadow: 0 1px 4px rgba(12, 12, 13, .05);
    }

    /* ---- Dynamic Island + status bar ---- */
    .island {
      position: absolute;
      top: 2.6cqw;
      left: 50%;
      transform: translateX(-50%);
      width: 27cqw;
      height: 8cqw;
      background: #000;
      border-radius: 4.5cqw;
      z-index: 5;
    }
    .island::after {
      content: "";
      position: absolute;
      right: 1.9cqw;
      top: 50%;
      transform: translateY(-50%);
      width: 4.6cqw;
      height: 4.6cqw;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1c2333, #06070d 62%);
    }
    .status {
      position: absolute;
      top: 3.1cqw;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7.6cqw 0 9.6cqw;
      height: 7cqw;
      color: #fff;
      font-size: 4.1cqw;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .status svg { width: 18.5cqw; height: auto; display: block; }

    @keyframes twinkle {
      from { opacity: .3; }
      to   { opacity: .95; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars-2"></div>
  </div>

  <main class="stage">
    <!-- Happy: dancing cat, burning fire -->
    <div class="phone">
      <div class="frame">
        <div class="screen happy">
          <div class="hero"></div>
          <img class="cat"  src="assets/cat-happy.svg"  alt="Котик танцует у горящего костра">
          <img class="fire" src="assets/fire-happy.svg" alt="">
          <div class="card"></div>
          <div class="status" aria-hidden="true">
            <span>9:41</span>
            <svg viewBox="0 0 77 13" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/>
              <rect x="5" y="6" width="3" height="6" rx="1" fill="#fff"/>
              <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="#fff"/>
              <rect x="15" y="1" width="3" height="11" rx="1" fill="#fff"/>
              <path d="M31.5 4.6a8.8 8.8 0 0 0-11.4 0l1.6 1.9a6.3 6.3 0 0 1 8.2 0l1.6-1.9Z" fill="#fff"/>
              <path d="M29 7.6a5 5 0 0 0-6.4 0l1.7 2a2.5 2.5 0 0 1 3 0l1.7-2Z" fill="#fff"/>
              <circle cx="25.8" cy="10.8" r="1.4" fill="#fff"/>
              <rect x="49" y="1.5" width="24" height="10" rx="3" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
              <rect x="51" y="3.5" width="17" height="6" rx="1.5" fill="#fff"/>
              <path d="M74.5 5v3a2 2 0 0 0 0-3Z" fill="#fff" fill-opacity=".5"/>
            </svg>
          </div>
          <div class="island"></div>
        </div>
      </div>
    </div>

    <!-- Sad: shivering cat, extinguished fire -->
    <div class="phone">
      <div class="frame">
        <div class="screen sad">
          <div class="hero"></div>
          <img class="cat"  src="assets/cat-sad.svg"  alt="Котик замёрз у потухшего костра">
          <img class="fire" src="assets/fire-sad.svg" alt="">
          <div class="card"></div>
          <div class="status" aria-hidden="true">
            <span>9:41</span>
            <svg viewBox="0 0 77 13" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/>
              <rect x="5" y="6" width="3" height="6" rx="1" fill="#fff"/>
              <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="#fff"/>
              <rect x="15" y="1" width="3" height="11" rx="1" fill="#fff"/>
              <path d="M31.5 4.6a8.8 8.8 0 0 0-11.4 0l1.6 1.9a6.3 6.3 0 0 1 8.2 0l1.6-1.9Z" fill="#fff"/>
              <path d="M29 7.6a5 5 0 0 0-6.4 0l1.7 2a2.5 2.5 0 0 1 3 0l1.7-2Z" fill="#fff"/>
              <circle cx="25.8" cy="10.8" r="1.4" fill="#fff"/>
              <rect x="49" y="1.5" width="24" height="10" rx="3" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
              <rect x="51" y="3.5" width="17" height="6" rx="1.5" fill="#fff"/>
              <path d="M74.5 5v3a2 2 0 0 0 0-3Z" fill="#fff" fill-opacity=".5"/>
            </svg>
          </div>
          <div class="island"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
