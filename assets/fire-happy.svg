<svg width="136" height="164" viewBox="0 0 136 164" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .cat        { transform-origin: 92px 176px;  animation: cat-dance 1.2s ease-in-out infinite; }
  .shadow     { transform-origin: 48px 172px;  animation: shadow-pulse .6s ease-in-out infinite; }
  .arm-left   { transform-origin: 54px 110px;  animation: arm-left-wave 1.2s ease-in-out infinite; }
  .arm-right  { transform-origin: 151px 91px;  animation: arm-right-wave 1.2s ease-in-out infinite; }
  .leg-left   { transform-origin: 95px 146px;  animation: leg-left-step 1.2s ease-in-out infinite; }
  .leg-right  { transform-origin: 117px 137px; animation: leg-right-step 1.2s ease-in-out infinite; }
  .ear-left   { transform-origin: 57px 88px;   animation: ear-left-wiggle 1.2s ease-in-out infinite; }
  .ear-right  { transform-origin: 121px 80px;  animation: ear-right-wiggle 1.2s ease-in-out infinite; }
  .face       { transform-origin: 93px 99px;   animation: face-bob 1.2s ease-in-out .06s infinite; }
  .mouth      { transform-origin: 92px 110px;  animation: mouth-sing .6s ease-in-out infinite alternate; }
  .eye-r      { transform-origin: 110px 95px;  animation: blink 3.6s linear infinite; }
  .eye-l      { transform-origin: 77px 95px;   animation: blink 3.6s linear infinite; }
  .ball       { animation: ball-bounce .6s ease-in-out -.3s infinite; }
  .flame-outer{ transform-origin: 219px 139px; animation: flicker .72s ease-in-out infinite; }
  .flame-inner{ transform-origin: 220px 129px; animation: flicker .54s ease-in-out -.2s infinite; }
  .glow       { transform-origin: 220px 160px; animation: glow-pulse .72s ease-in-out infinite alternate; }
  .spark      { animation: spark-rise 1.6s linear infinite; }
  .spark-2    { animation-name: spark-rise-b; animation-delay: -.55s; animation-duration: 1.45s; }
  .spark-3    { animation-delay: -1.1s; animation-duration: 1.75s; }
  .note       { animation: note-float 3.2s ease-out infinite; }
  .note-2     { animation-delay: -1.6s; }

  @keyframes cat-dance {
    0%, 100% { transform: translateY(0) rotate(-3.5deg) scale(1.015, .98); }
    25%, 75% { transform: translateY(-8px) rotate(0deg) scale(.99, 1.015); }
    50%      { transform: translateY(0) rotate(3.5deg) scale(1.015, .98); }
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scale(1, 1); opacity: 1; }
    50%      { transform: scale(.96, .92); opacity: .85; }
  }
  @keyframes arm-left-wave {
    0%, 50%, 100% { transform: rotate(-6deg); }
    25%, 75%      { transform: rotate(10deg); }
  }
  @keyframes arm-right-wave {
    0%, 50%, 100% { transform: rotate(6deg); }
    25%, 75%      { transform: rotate(-9deg); }
  }
  @keyframes leg-left-step {
    0%, 50%, 100% { transform: rotate(0deg); }
    25%           { transform: rotate(-7deg); }
    75%           { transform: rotate(3deg); }
  }
  @keyframes leg-right-step {
    0%, 50%, 100% { transform: rotate(0deg); }
    25%           { transform: rotate(4deg); }
    75%           { transform: rotate(-7deg); }
  }
  @keyframes ear-left-wiggle {
    0%, 100% { transform: rotate(3deg); }
    50%      { transform: rotate(-4deg); }
  }
  @keyframes ear-right-wiggle {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(4deg); }
  }
  @keyframes face-bob {
    0%, 100% { transform: translate(-1px, .5px) rotate(-1deg); }
    25%, 75% { transform: translate(0, -.8px) rotate(0deg); }
    50%      { transform: translate(1px, .5px) rotate(1deg); }
  }
  @keyframes mouth-sing {
    from { transform: scale(1, .98); }
    to   { transform: scale(1.03, 1.06); }
  }
  @keyframes blink {
    0%, 92%, 96.5%, 100% { transform: scaleY(1); }
    94%                  { transform: scaleY(.08); }
  }
  @keyframes ball-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1, 1) skewX(0deg); }
    30%      { transform: scale(1.02, 1.06) skewX(1.5deg); }
    55%      { transform: scale(.985, .92) skewX(-2deg); }
    80%      { transform: scale(1.005, 1.03) skewX(1deg); }
  }
  @keyframes glow-pulse {
    from { transform: scale(1, 1); opacity: .10; }
    to   { transform: scale(1.05, 1.07); opacity: .18; }
  }
  @keyframes spark-rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translate(7px, -52px); opacity: 0; }
  }
  @keyframes spark-rise-b {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translate(-8px, -48px); opacity: 0; }
  }
  @keyframes note-float {
    0%   { transform: translate(0, 3px) rotate(0deg); opacity: 0; }
    12%  { opacity: .7; }
    100% { transform: translate(-5px, -26px) rotate(-12deg); opacity: 0; }
  }
</style>
