<svg width="134" height="184" viewBox="0 0 134 184" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .cat        { transform-origin: 103px 176px;   animation: cat-sad 3.6s ease-in-out infinite; }
  .shiver     { animation: shiver 4s linear infinite; }
  .shadow     { transform-origin: 46.5px 164px;  animation: shadow-sad 3.6s ease-in-out infinite; }
  .arm-left   { transform-origin: 66px 112px;    animation: arm-left-hug 4s ease-in-out infinite; }
  .arm-right  { transform-origin: 152px 110px;   animation: arm-right-hug 4s ease-in-out infinite; }
  .ear-left   { transform-origin: 72px 86px;     animation: ear-left-droop 4s ease-in-out infinite; }
  .ear-right  { transform-origin: 137px 80px;    animation: ear-right-droop 4s ease-in-out infinite; }
  .face       { transform-origin: 106px 96px;    animation: face-sad 4s ease-in-out infinite; }
  .mouth      { transform-origin: 108.5px 109px; animation: mouth-quiver 4s linear infinite; }
  .eye-r      { transform-origin: 125.6px 92px;  animation: blink-sad 5s linear infinite; }
  .eye-l      { transform-origin: 93px 92px;     animation: blink-sad 5s linear infinite; }
  .ball       { animation: ball-drift 4.5s ease-in-out infinite alternate; }
  .ember      { transform-origin: 238px 158px;   animation: ember-glow 2.8s ease-in-out infinite alternate; }
  .spark      { animation: spark-fly 4.2s linear infinite; }
  .spark-2    { animation-name: spark-fly-b; animation-delay: -1.6s; animation-duration: 4.8s; }
  .spark-3    { animation-delay: -3.1s; animation-duration: 3.8s; }
  .chill      { opacity: 0; animation: chill-shake 4s linear infinite; }
  .chill-2    { animation-delay: .06s; }
  .chill-3    { animation-delay: .12s; }
  .pit-ember  { animation: pit-glow 2.2s ease-in-out infinite; }
  .pe-2       { animation-delay: -.7s; animation-duration: 2.6s; }
  .pe-3       { animation-delay: -1.4s; animation-duration: 1.9s; }
  .pe-4       { animation-delay: -.35s; animation-duration: 2.4s; }

  @keyframes cat-sad {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(1.5px) rotate(1deg) scale(1.01, .99); }
  }
  @keyframes shiver {
    0%, 60%, 82%, 100% { transform: translateX(0); }
    62% { transform: translateX(-.8px); }
    64% { transform: translateX(.8px); }
    66% { transform: translateX(-.8px); }
    68% { transform: translateX(.7px); }
    70% { transform: translateX(-.6px); }
    72% { transform: translateX(.5px); }
    74% { transform: translateX(-.4px); }
    76% { transform: translateX(.3px); }
    78% { transform: translateX(-.2px); }
    80% { transform: translateX(.1px); }
  }
  @keyframes shadow-sad {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(.985, .97); }
  }
  @keyframes arm-left-hug {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    25%      { transform: translateY(0) rotate(-2.5deg); }
    54%, 80% { transform: translateY(-1.5px) rotate(-11deg); }
    90%      { transform: translateY(0) rotate(-5deg); }
  }
  @keyframes arm-right-hug {
    0%, 100% { transform: translateY(0) rotate(4deg); }
    25%      { transform: translateY(0) rotate(2.5deg); }
    54%, 80% { transform: translateY(-1.5px) rotate(11deg); }
    90%      { transform: translateY(0) rotate(5deg); }
  }
  @keyframes ear-left-droop {
    0%, 100% { transform: rotate(-1.5deg); }
    25%      { transform: rotate(.5deg); }
    54%, 80% { transform: rotate(-4deg); }
    90%      { transform: rotate(-1deg); }
  }
  @keyframes ear-right-droop {
    0%, 100% { transform: rotate(1.5deg); }
    25%      { transform: rotate(-.5deg); }
    54%, 80% { transform: rotate(4deg); }
    90%      { transform: rotate(1deg); }
  }
  @keyframes face-sad {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(0, .6px); }
    54%, 80% { transform: translate(0, 1.8px); }
    90%      { transform: translate(0, .4px); }
  }
  @keyframes mouth-quiver {
    0%, 58%, 82%, 100% { transform: scale(1, 1); }
    60% { transform: scale(1.06, 1.3); }
    62% { transform: scale(.98, .82); }
    64% { transform: scale(1.07, 1.35); }
    66% { transform: scale(.97, .8); }
    68% { transform: scale(1.06, 1.3); }
    70% { transform: scale(.98, .85); }
    72% { transform: scale(1.05, 1.25); }
    74% { transform: scale(.99, .9); }
    76% { transform: scale(1.03, 1.15); }
    78% { transform: scale(1, .95); }
  }
  @keyframes blink-sad {
    0%, 86%, 94%, 100% { transform: scaleY(1); }
    89%, 91%           { transform: scaleY(.12); }
  }
  @keyframes ball-drift {
    from { transform: translateY(0); }
    to   { transform: translateY(-3px); }
  }
  @keyframes ember-glow {
    from { opacity: .04; transform: scale(1); }
    to   { opacity: .12; transform: scale(1.06); }
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0); opacity: 0; }
    8%   { opacity: .9; }
    25%  { transform: translate(5px, -30px); opacity: .55; }
    45%  { transform: translate(-2px, -58px); opacity: .8; }
    65%  { transform: translate(6px, -85px); opacity: .4; }
    85%  { transform: translate(10px, -108px); opacity: .6; }
    100% { transform: translate(12px, -122px); opacity: 0; }
  }
  @keyframes spark-fly-b {
    0%   { transform: translate(0, 0); opacity: 0; }
    8%   { opacity: .85; }
    25%  { transform: translate(-4px, -28px); opacity: .5; }
    45%  { transform: translate(3px, -55px); opacity: .75; }
    65%  { transform: translate(-6px, -82px); opacity: .35; }
    85%  { transform: translate(-9px, -105px); opacity: .55; }
    100% { transform: translate(-11px, -118px); opacity: 0; }
  }
  @keyframes pit-glow {
    0%, 100% { opacity: .35; }
    50%      { opacity: .95; }
  }
  @keyframes chill-shake {
    0%, 56%, 84%, 100% { opacity: 0; transform: translateX(0); }
    60% { opacity: .85; transform: translateX(-2px); }
    63% { opacity: .85; transform: translateX(2px); }
    66% { opacity: .85; transform: translateX(-2px); }
    69% { opacity: .85; transform: translateX(2px); }
    72% { opacity: .8;  transform: translateX(-1.6px); }
    75% { opacity: .75; transform: translateX(1.2px); }
    78% { opacity: .6;  transform: translateX(-.8px); }
    81% { opacity: .35; transform: translateX(.4px); }
  }
</style>
<g transform="translate(-170,-20)">
